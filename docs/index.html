<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>座位一键签到</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#1e3a8a 0%,#312e81 50%,#4c1d95 100%);
    min-height:100vh; min-height:100dvh; color:#fff;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  h1 { font-size:22px; margin-top:calc(env(safe-area-inset-top) + 28px); font-weight:700; letter-spacing:1px; }
  .sub { font-size:13px; opacity:.75; margin-top:8px; text-align:center; line-height:1.6; }
  .stage { width:100%; max-width:420px; margin-top:34px; display:flex; flex-direction:column; gap:18px; }
  .btn {
    border:none; border-radius:20px; padding:26px 20px; font-size:21px; font-weight:700;
    color:#fff; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .08s ease, filter .2s; letter-spacing:2px;
  }
  .btn:active { transform:scale(.96); }
  .btn:disabled { opacity:.55; filter:grayscale(.3); cursor:not-allowed; }
  .btn-in  { background:linear-gradient(135deg,#16a34a,#15803d); }
  .btn-back{ background:linear-gradient(135deg,#ea580c,#c2410c); }
  .btn-enter{ background:linear-gradient(135deg,#2563eb,#4f46e5); }
  .btn small { font-size:12px; font-weight:400; opacity:.85; letter-spacing:0; margin-left:2px; }
  .hint { font-size:12px; opacity:.7; text-align:center; line-height:1.6; margin:-6px 2px -4px; }
  .ico { font-size:26px; }
  .status {
    margin-top:26px; width:100%; max-width:420px; min-height:54px; border-radius:14px;
    background:rgba(255,255,255,.12); backdrop-filter:blur(8px);
    padding:16px 18px; font-size:14px; line-height:1.7; display:none; word-break:break-all;
  }
  .status.show { display:block; }
  .status.ok { background:rgba(22,163,74,.25); }
  .status.err { background:rgba(220,38,38,.3); }
  .gear { margin-top:auto; padding:22px 0 12px; }
  .gear a { color:rgba(255,255,255,.65); font-size:13px; text-decoration:none; }
  /* 设置弹窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:9; }
  .mask.show { display:flex; }
  .sheet { width:100%; max-width:460px; background:#fff; color:#1f2937; border-radius:22px 22px 0 0; padding:24px 22px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet h2 { font-size:18px; margin-bottom:6px; }
  .sheet p { font-size:13px; color:#6b7280; line-height:1.6; margin-bottom:16px; }
  .sheet input { width:100%; padding:14px 16px; border:1.5px solid #d1d5db; border-radius:12px; font-size:15px; margin-bottom:16px; }
  .sheet input:focus { outline:none; border-color:#4f46e5; }
  .sheet .save { width:100%; border:none; border-radius:12px; padding:15px; background:#4f46e5; color:#fff; font-size:16px; font-weight:600; }
</style>
</head>
<body>
  <h1>📚 图书馆座位</h1>
  <div class="sub">不用扫码 · 一键处理 263 座<br>点一下，云端立刻执行，结果微信推给你</div>

  <div class="stage">
    <button class="btn btn-in"  id="btnIn"  onclick="fire('signin')">
      <span class="ico">✅</span>一键签到
    </button>
    <button class="btn btn-back" id="btnBack" onclick="fire('signback')">
      <span class="ico">🔚</span>一键签退
    </button>
    <div class="hint">中午回馆被门禁拦下时用：自动退掉学习中的旧座，秒约当前半点场（保持待履约，<b>不自动签到</b>）。仅 263 座 / 账号1。</div>
    <button class="btn btn-enter" id="btnEnter" onclick="fireEnter()">
      <span class="ico">🚪</span>进馆模式<small>仅263</small>
    </button>
  </div>

  <div class="status" id="status"></div>

  <div class="gear"><a href="javascript:openSetup()">⚙️ 设置令牌</a></div>

  <div class="mask" id="mask">
    <div class="sheet">
      <h2>设置 GitHub 令牌</h2>
      <p>令牌只用于触发你自己仓库的任务，<b>仅保存在本手机浏览器</b>（localStorage），不会上传或写进任何代码。需要有权限操作该仓库 Actions 的令牌。</p>
      <input id="token" type="password" placeholder="粘贴 ghp_ 或 github_pat_ 开头的令牌" autocomplete="off">
      <button class="save" onclick="saveToken()">保存</button>
    </div>
  </div>

<script>
  const OWNER = "wangyang20051031";
  const REPO  = "seat-grab";
  const WF    = "seat.yml";

  function $(id){ return document.getElementById(id); }

  function openSetup(){
    $("token").value = localStorage.getItem("gh_token") || "";
    $("mask").classList.add("show");
  }
  function saveToken(){
    const t = $("token").value.trim();
    if(!t){ alert("请粘贴令牌"); return; }
    localStorage.setItem("gh_token", t);
    $("mask").classList.remove("show");
    setStatus("令牌已保存到本手机。", "ok");
  }

  function setStatus(msg, type){
    const s = $("status");
    s.className = "status show " + (type||"");
    s.innerHTML = msg;
  }

  function lockButtons(on){
    ["btnIn","btnBack","btnEnter"].forEach(id => { $(id).disabled = on; });
  }

  async function dispatch(mode){
    const token = (localStorage.getItem("gh_token")||"").trim();
    if(!token){ openSetup(); return 401; }
    const resp = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WF}/dispatches`,
      {
        method:"POST",
        headers:{
          "Authorization":"Bearer "+token,
          "Accept":"application/vnd.github+json",
          "Content-Type":"application/json"
        },
        body: JSON.stringify({ ref:"main", inputs:{ mode:mode } })
      }
    );
    return resp;
  }

  async function fire(mode){
    const word = mode==="signin" ? "签到" : "签退";
    lockButtons(true);
    setStatus(`⏳ 正在触发云端<b>${word}</b>，请稍候...`);

    try {
      const resp = await dispatch(mode);
      if(resp === 401) return;
      if(resp.status===204){
        setStatus(`✅ <b>${word}任务已触发！</b><br>云端正在处理 263 座，约 1 分钟内留意微信“${word}成功”推送。`, "ok");
      } else if(resp.status===401){
        setStatus("❌ 令牌无效或已过期，请点底部“设置令牌”更新。", "err");
      } else {
        const t = await resp.text();
        setStatus(`❌ 触发失败（HTTP ${resp.status}）：<br>${t.slice(0,300)}`, "err");
      }
    } catch(e){
      setStatus("❌ 网络错误："+e+"<br>请检查手机网络后重试。", "err");
    } finally {
      lockButtons(false);
    }
  }

  async function fireEnter(){
    lockButtons(true);
    setStatus("⏳ 正在执行<b>进馆模式</b>：云端退旧座 → 秒约当前半点场，约需 10～40 秒，请勿重复点击...");
    try {
      const resp = await dispatch("enter");
      if(resp === 401) return;
      if(resp.status===204){
        setStatus(`✅ <b>进馆模式已触发（263座）！</b><br>请留意微信“🚪进馆模式就绪”推送；<b>收到后立刻刷脸进门</b>，进门走到座位再点上面“一键签到”。<br>若收到“未完成”推送，按提示手动退座重约。`, "ok");
      } else if(resp.status===401){
        setStatus("❌ 令牌无效或已过期，请点底部“设置令牌”更新。", "err");
      } else {
        const t = await resp.text();
        setStatus(`❌ 触发失败（HTTP ${resp.status}）：<br>${t.slice(0,300)}`, "err");
      }
    } catch(e){
      setStatus("❌ 网络错误："+e+"<br>请检查手机网络后重试。", "err");
    } finally {
      lockButtons(false);
    }
  }

  if(!localStorage.getItem("gh_token")){ openSetup(); }
</script>
</body>
</html>
