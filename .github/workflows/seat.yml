name: 图书馆抢座

# 抢座四重冗余（北京时间）：18:20 / 19:00 / 19:25 / 19:45，脚本内部精确等待到 20:00:00
# 签到三重冗余（北京时间）：06:58（主）/ 07:10 / 07:22，窗口 07:00-07:30
# 签退三重冗余（北京时间）：21:53（主）/ 21:59 / 22:06，窗口 21:55-22:05
# 重复的签到/签退由脚本识别状态后静默跳过；只有真正执行成功的任务才推送微信
on:
  schedule:
    - cron: '20 10 * * *'           # 抢座 北京时间 18:20
    - cron: '0 11 * * *'            # 抢座 北京时间 19:00
    - cron: '25 11 * * *'           # 抢座 北京时间 19:25
    - cron: '45 11 * * *'           # 抢座 北京时间 19:45
    - cron: '58 22 * * *'           # 签到 北京时间 次日 06:58（主任务）
    - cron: '10 23 * * *'           # 签到 北京时间 07:10（备用）
    - cron: '22 23 * * *'           # 签到 北京时间 07:22（末班车）
    - cron: '53 13 * * *'           # 签退 北京时间 21:53（主任务）
    - cron: '59 13 * * *'           # 签退 北京时间 21:59（备用）
    - cron: '6 14 * * *'            # 签退 北京时间 22:06（末班车）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（run=抢座 inspect=只测登录 signin=手动测签到 signback=手动测签退）'
        type: choice
        default: run
        options:
          - run
          - inspect
          - signin
          - signback

# 不使用 concurrency 限制：定时任务并行作为冗余；重复操作由脚本识别状态后静默跳过。

permissions:
  contents: read

jobs:
  grab:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.mode == 'run' || github.event.inputs.mode == 'inspect')) ||
      (github.event_name == 'schedule' &&
        contains(fromJSON('["20 10 * * *", "0 11 * * *", "25 11 * * *", "45 11 * * *"]'),
                 github.event.schedule))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 执行抢座
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py ${{ github.event.inputs.mode || 'run' }}

  sign:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.mode == 'signin' || github.event.inputs.mode == 'signback')) ||
      (github.event_name == 'schedule' &&
        contains(fromJSON('["58 22 * * *", "10 23 * * *", "22 23 * * *",
                          "53 13 * * *", "59 13 * * *", "6 14 * * *"]'),
                 github.event.schedule))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 判断本次动作（签到/签退）
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "58 22 * * *"|"10 23 * * *"|"22 23 * * *") ACTION=signin ;;
              *) ACTION=signback ;;
            esac
          fi
          echo "本次动作：$ACTION"
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"

      - name: 执行签到/签退
        env:
          ACTION: ${{ env.ACTION }}
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py "$ACTION"
