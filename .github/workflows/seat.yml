name: 图书馆抢座

# 抢座三重冗余（北京时间）：19:52 / 19:57 / 20:02，脚本内部精确等到 20:00:00
#   （定时任务即使被 GitHub 延迟几分钟，启动后立即提交，不影响结果）
# 签到三重冗余（北京时间）：06:58（主）/ 07:10 / 07:22，窗口 07:00-07:30
# 签退三重冗余（北京时间）：21:54（主）/ 22:00 / 22:04，窗口 21:55-22:08
# 双账号矩阵：账号1 -> 263 座，账号2 -> 258 座，各自登录、各自签到签退
# 重复的签到/签退由脚本识别状态后静默跳过；只有真正执行成功的任务才推送微信
on:
  schedule:
    - cron: '52 11 * * *'           # 抢座 北京时间 19:52
    - cron: '57 11 * * *'           # 抢座 北京时间 19:57
    - cron: '2 12 * * *'            # 抢座 北京时间 20:02
    - cron: '58 22 * * *'           # 签到 北京时间 次日 06:58（主任务）
    - cron: '10 23 * * *'           # 签到 北京时间 07:10（备用）
    - cron: '22 23 * * *'           # 签到 北京时间 07:22（末班车）
    - cron: '54 13 * * *'           # 签退 北京时间 21:54（主任务）
    - cron: '0 14 * * *'            # 签退 北京时间 22:00（备用）
    - cron: '4 14 * * *'            # 签退 北京时间 22:04（末班车）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（run=抢座 inspect=只测登录 signin=手动测签到 signback=手动测签退）'
        type: choice
        default: run
        options:
          - run
          - inspect
          - signin
          - signback

# 不使用 concurrency 限制：定时任务并行作为冗余；重复操作由脚本识别状态后静默跳过。

permissions:
  contents: read

jobs:
  grab:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.mode == 'run' || github.event.inputs.mode == 'inspect')) ||
      (github.event_name == 'schedule' &&
        contains(fromJSON('["52 11 * * *", "57 11 * * *", "2 12 * * *"]'),
                 github.event.schedule))
    strategy:
      fail-fast: false
      matrix:
        acc:
          - { idx: '1', seat: '263' }
          - { idx: '2', seat: '258' }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 执行抢座
        env:
          ACCOUNT_IDX: ${{ matrix.acc.idx }}
          SEAT_NUM: ${{ matrix.acc.seat }}
          CHAOXING_USERNAME: ${{ matrix.acc.idx == '1' && secrets.CHAOXING_USERNAME || secrets.CHAOXING_USERNAME_2 }}
          CHAOXING_PASSWORD: ${{ matrix.acc.idx == '1' && secrets.CHAOXING_PASSWORD || secrets.CHAOXING_PASSWORD_2 }}
          CHAOXING_USERNAME_2: ${{ secrets.CHAOXING_USERNAME_2 }}
          CHAOXING_PASSWORD_2: ${{ secrets.CHAOXING_PASSWORD_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py ${{ github.event.inputs.mode || 'run' }}

  sign:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.mode == 'signin' || github.event.inputs.mode == 'signback')) ||
      (github.event_name == 'schedule' &&
        contains(fromJSON('["58 22 * * *", "10 23 * * *", "22 23 * * *",
                          "54 13 * * *", "0 14 * * *", "4 14 * * *"]'),
                 github.event.schedule))
    strategy:
      fail-fast: false
      matrix:
        acc:
          - { idx: '1', seat: '263' }
          - { idx: '2', seat: '258' }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 判断本次动作（签到/签退）
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "58 22 * * *"|"10 23 * * *"|"22 23 * * *") ACTION=signin ;;
              *) ACTION=signback ;;
            esac
          fi
          echo "本次动作：$ACTION（账号${{ matrix.acc.idx }} / ${{ matrix.acc.seat }}座）"
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"

      - name: 执行签到/签退
        env:
          ACTION: ${{ env.ACTION }}
          ACCOUNT_IDX: ${{ matrix.acc.idx }}
          SEAT_NUM: ${{ matrix.acc.seat }}
          CHAOXING_USERNAME: ${{ matrix.acc.idx == '1' && secrets.CHAOXING_USERNAME || secrets.CHAOXING_USERNAME_2 }}
          CHAOXING_PASSWORD: ${{ matrix.acc.idx == '1' && secrets.CHAOXING_PASSWORD || secrets.CHAOXING_PASSWORD_2 }}
          CHAOXING_USERNAME_2: ${{ secrets.CHAOXING_USERNAME_2 }}
          CHAOXING_PASSWORD_2: ${{ secrets.CHAOXING_PASSWORD_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py "$ACTION"
