name: 图书馆抢座

# 多重定时冗余：18:20 / 19:00 / 19:25 / 19:45 四个任务；脚本内部精确等待到 20:00:00 提交
# 重复提交由脚本识别“已有预约”后静默跳过，抢到的任务才推送微信
on:
  schedule:
    - cron: '20 10 * * *'           # 北京时间 18:20
    - cron: '0 11 * * *'            # 北京时间 19:00
    - cron: '25 11 * * *'           # 北京时间 19:25
    - cron: '45 11 * * *'           # 北京时间 19:45
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（run=正式抢座 inspect=只测登录和页面）'
        type: choice
        default: run
        options:
          - run
          - inspect

# 注：不使用 concurrency 限制，两个定时任务可并行作为冗余；
# 同账号同座位重复提交由脚本识别“已有预约”后静默跳过。

permissions:
  contents: read

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 执行抢座
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py ${{ github.event.inputs.mode || 'run' }}
