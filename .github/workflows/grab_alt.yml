name: 备用账号抢座
on:
  workflow_dispatch:
    inputs:
      seat:
        description: '座位号'
        required: true
        default: '141'
      mode:
        description: 'run / inspect / signin / signback'
        required: true
        default: 'run'
      day_offset:
        description: '0=今天 1=明天'
        required: true
        default: '1'
      account:
        description: '2 或 3（默认 3）'
        required: true
        default: '3'
  schedule:
    # 签到（北京时间 06:35 / 06:40 / 06:48 / 06:56 / 07:04 / 07:10）
    - cron: '35 22 * * *'
    - cron: '40 22 * * *'
    - cron: '48 22 * * *'
    - cron: '56 22 * * *'
    - cron: '4 23 * * *'
    - cron: '10 23 * * *'
    # 签退（北京时间 10:48 / 10:54 / 10:58 / 11:00 / 11:02 / 11:04）
    - cron: '48 2 * * *'
    - cron: '54 2 * * *'
    - cron: '58 2 * * *'
    - cron: '0 3 * * *'
    - cron: '2 3 * * *'
    - cron: '4 3 * * *'
jobs:
  alt-grab:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.mode == 'run' || github.event.inputs.mode == 'inspect')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests cryptography
      - name: 执行抢座
        env:
          ACCOUNT_IDX: ${{ github.event.inputs.account }}
          SEAT_NUM: ${{ github.event.inputs.seat }}
          DAY_OFFSET: ${{ github.event.inputs.day_offset }}
          CHAOXING_USERNAME: ${{ (github.event.inputs.account == '2') && secrets.CHAOXING_USERNAME_2 || secrets.CHAOXING_USERNAME_3 }}
          CHAOXING_PASSWORD: ${{ (github.event.inputs.account == '2') && secrets.CHAOXING_PASSWORD_2 || secrets.CHAOXING_PASSWORD_3 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py ${{ github.event.inputs.mode }}
  alt-signin:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'signin') ||
      (github.event_name == 'schedule' &&
        contains(fromJSON('["35 22 * * *", "40 22 * * *", "48 22 * * *", "56 22 * * *", "4 23 * * *", "10 23 * * *"]'),
                 github.event.schedule))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests cryptography
      - name: 执行签到
        env:
          ACCOUNT_IDX: ${{ github.event.inputs.account || '3' }}
          SEAT_NUM: ${{ github.event.inputs.seat || '141' }}
          CHAOXING_USERNAME: ${{ (github.event.inputs.account == '2') && secrets.CHAOXING_USERNAME_2 || secrets.CHAOXING_USERNAME_3 }}
          CHAOXING_PASSWORD: ${{ (github.event.inputs.account == '2') && secrets.CHAOXING_PASSWORD_2 || secrets.CHAOXING_PASSWORD_3 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py signin
  alt-signback:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'signback') ||
      (github.event_name == 'schedule' &&
        contains(fromJSON('["48 2 * * *", "54 2 * * *", "58 2 * * *", "0 3 * * *", "2 3 * * *", "4 3 * * *"]'),
                 github.event.schedule))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests cryptography
      - name: 执行签退
        env:
          ACCOUNT_IDX: ${{ github.event.inputs.account || '3' }}
          SEAT_NUM: ${{ github.event.inputs.seat || '141' }}
          CHAOXING_USERNAME: ${{ (github.event.inputs.account == '2') && secrets.CHAOXING_USERNAME_2 || secrets.CHAOXING_USERNAME_3 }}
          CHAOXING_PASSWORD: ${{ (github.event.inputs.account == '2') && secrets.CHAOXING_PASSWORD_2 || secrets.CHAOXING_PASSWORD_3 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python grab_seat.py signback
